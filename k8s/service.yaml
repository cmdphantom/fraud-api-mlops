apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  labels:
    app: fraud-api
spec:
  type: NodePort
  selector:
    app: fraud-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  type: NodePort
  selector:
    app: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30051
      protocol: TCP